name: Update meetings

on:
  schedule:
    # 6:17 am, 12:17 pm and 6:17 pm Eastern (UTC times; shift by an hour in winter is fine)
    - cron: "17 10,16,22 * * *"
  workflow_dispatch: {}        # "Run workflow" button for a manual refresh

permissions:
  contents: write              # save data/ history back to the repo
  pages: write
  id-token: write

concurrency:
  group: update-meetings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Self-test against saved samples
        run: python -m pytest -q

      - name: Fetch sources and build site
        id: build
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          python -m tracker.build || echo "health_failed=1" >> "$GITHUB_OUTPUT"

      - name: Save history
        run: |
          git config user.name "meetings-bot"
          git config user.email "meetings-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update meetings $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # Fail last, after the site is published with whatever data is good.
      # A failed scheduled run makes GitHub email the repo owner: that's the alarm.
      - name: Report source problems
        if: steps.build.outputs.health_failed == '1'
        run: |
          python -c "import json; [print('::error::'+p['message']) for p in json.load(open('data/status.json'))['problems'] if p['level']=='error']"
          exit 1
